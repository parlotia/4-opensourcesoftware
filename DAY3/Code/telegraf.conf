# Telegraf 配置 - Day3 TIG 监控平台
# SNMP 采集 + gRPC Telemetry 接收 + InfluxDB 2.x 写入

# ========== 全局设置 ==========
[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"

# ========== 输出：InfluxDB 2.x ==========
[[outputs.influxdb_v2]]
  urls = ["http://qyt-influx:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

# ========== 输入：SNMP 采集 ==========
[[inputs.snmp]]
  agents = ["10.10.1.201:161", "10.10.1.202:161"]
  timeout = "5s"
  version = 2
  community = "qytangro"
  retries = 3
  max_repetitions = 30
  name = "C8Kv_Snmp_v2c"
  agent_host_tag = "source"

  [[inputs.snmp.field]]
    name = "sysuptime"
    oid = "1.3.6.1.2.1.1.3.0"

  [[inputs.snmp.field]]
    name = "CPUTotal5sec"
    oid = "1.3.6.1.4.1.9.9.109.1.1.1.1.3.7"

  [[inputs.snmp.field]]
    name = "MemoryUsed"
    oid = "1.3.6.1.4.1.9.9.109.1.1.1.1.12.7"

  [[inputs.snmp.field]]
    name = "MemoryFree"
    oid = "1.3.6.1.4.1.9.9.109.1.1.1.1.13.7"

  [[inputs.snmp.field]]
    name = "CPUTotal5sec-iosd"
    oid = "1.3.6.1.4.1.9.2.1.56.0"

  [[inputs.snmp.field]]
    name = "MemoryUsed-iosd"
    oid = "1.3.6.1.4.1.9.9.48.1.1.1.5.1"

  [[inputs.snmp.field]]
    name = "MemoryFree-iosd"
    oid = "1.3.6.1.4.1.9.9.48.1.1.1.6.1"

  [[inputs.snmp.table]]
    name = "interface_table"
    inherit_tags = ["source", "hostname"]

    [[inputs.snmp.table.field]]
      name = "ifDescr"
      oid = "1.3.6.1.2.1.2.2.1.2"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "ifInOctets"
      oid = "1.3.6.1.2.1.2.2.1.10"

    [[inputs.snmp.table.field]]
      name = "ifOutOctets"
      oid = "1.3.6.1.2.1.2.2.1.16"

# ========== 输入：gRPC Telemetry (Cisco MDT) ==========
[[inputs.cisco_telemetry_mdt]]
  transport = "grpc"
  service_address = ":57000"

  [inputs.cisco_telemetry_mdt.aliases]
    ifstats = "ietf-interfaces:interfaces-state/interface/statistics"
