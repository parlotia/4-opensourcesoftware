---
# 设备清单：每台设备的差异化数据
# 真实管理地址 + 业务配置数据均按 inventory_hostname 索引
C8Kv1:
  hostname: 10.10.1.201
  groups:
    - cisco_ios
  data:
    hostname_config: C8Kv1
    interfaces:
      - {name: Loopback0,        ip: 1.1.1.1,    mask: 255.255.255.0, enabled: false}
      - {name: GigabitEthernet2, ip: 61.128.1.1, mask: 255.255.255.0, enabled: true}
    ospf:
      process_id: 1
      router_id: 1.1.1.1
      networks:
        - {network: 1.1.1.0,    wildcard: 0.0.0.255, area: 0}
        - {network: 61.128.1.0, wildcard: 0.0.0.255, area: 0}

C8Kv2:
  hostname: 10.10.1.202
  groups:
    - cisco_ios
  data:
    hostname_config: C8Kv2
    interfaces:
      - {name: Loopback0,        ip: 2.2.2.2,    mask: 255.255.255.0, enabled: false}
      - {name: GigabitEthernet2, ip: 61.128.1.2, mask: 255.255.255.0, enabled: true}
    ospf:
      process_id: 1
      router_id: 2.2.2.2
      networks:
        - {network: 2.2.2.0,    wildcard: 0.0.0.255, area: 0}
        - {network: 61.128.1.0, wildcard: 0.0.0.255, area: 0}
